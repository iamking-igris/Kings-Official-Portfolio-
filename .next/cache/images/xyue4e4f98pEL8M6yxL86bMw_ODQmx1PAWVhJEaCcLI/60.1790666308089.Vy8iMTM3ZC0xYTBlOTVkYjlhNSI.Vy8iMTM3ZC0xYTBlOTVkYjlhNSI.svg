  <g opacity="0.9">
    <circle cx="1260" cy="240" r="130" fill="url(#igris-accent)" fill-opacity="0.08"/>
    <circle cx="1326" cy="204" r="20" fill="#EDE8DF" fill-opacity="0.7"/>
  </g>
