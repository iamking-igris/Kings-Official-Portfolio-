<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
<rect width="1600" height="900" fill="#0d0d0d"/>
<rect x="0" y="0" width="1600" height="56" fill="#111"/>
<text x="40" y="36" fill="#f3f1ec" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">FILE INTELLIGENCE API</text>
<text x="1380" y="36" fill="#555" font-family="ui-monospace,monospace" font-size="11">v1 / docs</text>
<!-- left panel -->
<rect x="40" y="90" width="740" height="760" rx="8" fill="#141414" stroke="#2a2a2a"/>
<text x="70" y="140" fill="#888" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">INPUT</text>
<text x="70" y="180" fill="#f3f1ec" font-family="system-ui,sans-serif" font-size="20">Upload or POST a file</text>
<rect x="70" y="220" width="680" height="160" rx="8" stroke="#333" stroke-dasharray="8 6" fill="#101010"/>
<text x="300" y="300" fill="#555" font-family="system-ui,sans-serif" font-size="14">Drop PDF, DOCX, or image</text>
<text x="70" y="440" fill="#666" font-family="ui-monospace,monospace" font-size="12">POST /v1/extract</text>
<rect x="70" y="470" width="200" height="14" rx="2" fill="#2a2a2a"/>
<rect x="70" y="500" width="320" height="14" rx="2" fill="#222"/>
<rect x="70" y="530" width="280" height="14" rx="2" fill="#222"/>
<rect x="70" y="600" width="160" height="40" rx="4" fill="#f3f1ec"/>
<text x="100" y="625" fill="#0d0d0d" font-family="system-ui,sans-serif" font-size="12">Run extract</text>
<!-- right panel -->
<rect x="820" y="90" width="740" height="760" rx="8" fill="#141414" stroke="#2a2a2a"/>
<text x="850" y="140" fill="#888" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">STRUCTURED OUTPUT</text>
<text x="850" y="180" fill="#f3f1ec" font-family="system-ui,sans-serif" font-size="20">JSON the caller can trust</text>
<rect x="850" y="220" width="680" height="520" rx="8" fill="#101010" stroke="#2a2a2a"/>
<text x="880" y="270" fill="#6a9" font-family="ui-monospace,monospace" font-size="13">{</text>
<text x="900" y="300" fill="#8ab" font-family="ui-monospace,monospace" font-size="13">"document_type": "invoice",</text>
<text x="900" y="330" fill="#8ab" font-family="ui-monospace,monospace" font-size="13">"fields": {</text>
<text x="920" y="360" fill="#c9a" font-family="ui-monospace,monospace" font-size="13">"vendor": "...",</text>
<text x="920" y="390" fill="#c9a" font-family="ui-monospace,monospace" font-size="13">"total": "..."</text>
<text x="900" y="420" fill="#8ab" font-family="ui-monospace,monospace" font-size="13">},</text>
<text x="900" y="450" fill="#8ab" font-family="ui-monospace,monospace" font-size="13">"confidence": 0.94</text>
<text x="880" y="480" fill="#6a9" font-family="ui-monospace,monospace" font-size="13">}</text>
<text x="850" y="780" fill="#555" font-family="system-ui,sans-serif" font-size="12">FastAPI · stable schema · built to be called</text>
</svg>